name: Validate

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: YAML Lint
        run: yamllint .

      - name: Validate Team A Rules
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          victoriametrics/vmalert:v1.143.0 \
          -rule=/workspace/teams/team-a/vmrule.yaml

      - name: Validate Team B Rules
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          victoriametrics/vmalert:v1.143.0 \ -rule=/workspace/teams/team-b/vmrule.yaml